name: Published release upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upgrade.yml"
      - "scripts/check-release-upgrade*"
      - "scripts/check-compatibility.py"
      - "scripts/test_monitoring_upgrade.py"
      - "docker/Dockerfile.dashboards"
  pull_request:
    paths:
      - ".github/workflows/upgrade.yml"
      - "scripts/check-release-upgrade*"
      - "scripts/check-compatibility.py"
      - "scripts/test_monitoring_upgrade.py"
      - "docker/Dockerfile.dashboards"

permissions:
  contents: read

concurrency:
  group: release-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release input validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_monitoring_upgrade.py
      - name: Install pinned browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --prefix .cache/browser-tests --no-save playwright@1.65.0
      - name: Upgrade and rollback published releases with persistent data
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.cache/browser-tests/node_modules/playwright
        run: python3 scripts/check-release-upgrade.py
      - name: Upload verification results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-upgrade-results
          path: .cache/release-upgrade-results.json
          if-no-files-found: error
