name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache/yarn
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CYPRESS_INSTALL_BINARY: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Cache pinned toolchain and dependency downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .cache/node-v22.23.0-linux-x64
            .cache/yarn
          key: ubuntu24-x64-osd-def668b5c4ad825dfff980ed0951cca07aa0ac4b-node22.23.0-${{ hashFiles('scripts/bootstrap.sh') }}
      - name: Bootstrap exact OpenSearch Dashboards 3.9.0
        run: |
          bash scripts/bootstrap.sh
          echo "$GITHUB_WORKSPACE/.cache/node-v22.23.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Unit and isolated UI tests
        run: npm test
      - name: Synthetic processing profile
        run: node scripts/benchmark-monitoring.cjs
      - name: Provisioner tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_monitoring*.py'
      - name: Build official plugin archive
        run: bash scripts/build-plugin.sh
      - name: Type-check against the official host
        run: node .cache/OpenSearch-Dashboards/node_modules/typescript/bin/tsc --project .cache/OpenSearch-Dashboards/plugins/stack_monitoring/tsconfig.json --noEmit
      - name: Upload checked archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-monitoring-dashboards-3.9.0-linux
          path: artifacts/stack-monitoring.zip
          if-no-files-found: error
          retention-days: 7
