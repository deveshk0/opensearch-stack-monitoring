server.host: "0.0.0.0"
server.name: opensearch-dashboards-local
opensearch.hosts: ["https://os01:9200", "https://os02:9200", "https://os03:9200"]
# The local Docker deployment uses OpenSearch's bundled demo certificates.
opensearch.ssl.verificationMode: none
opensearch.username: stack_dashboards
opensearch.password: "${OPENSEARCH_PASSWORD}"
opensearch.requestHeadersAllowlist: [authorization, securitytenant]
opensearch_security.multitenancy.enabled: true
opensearch_security.readonly_mode.roles: [kibana_read_only]
opensearch_security.cookie.secure: false
uiSettings.overrides.defaultRoute: /app/stackMonitoring
stackMonitoring.collection.username: stack_monitoring_collector
stackMonitoring.collection.password: "${MONITORING_COLLECTOR_PASSWORD}"
