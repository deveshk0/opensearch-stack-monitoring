name: opensearch-monitoring

x-node: &node
  image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
  mem_limit: 1536m
  restart: unless-stopped
  environment: &node-env
    cluster.name: opensearch-local
    discovery.seed_hosts: os01,os02,os03
    cluster.initial_cluster_manager_nodes: os01,os02,os03
    bootstrap.memory_lock: 'true'
    # shortcut: disable mmap for this local demo; enable with host tuning before load testing.
    node.store.allow_mmap: 'false'
    OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
  ulimits:
    memlock: {soft: -1, hard: -1}
    nofile: {soft: 65536, hard: 65536}
  healthcheck:
    test: [CMD-SHELL, 'curl -ksf -u "admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD" https://localhost:9200/_cluster/health >/dev/null']
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 30s

services:
  os01:
    <<: *node
    environment:
      <<: *node-env
      node.name: os01
    ports: ['127.0.0.1:9201:9200']
    volumes: [osdata01:/usr/share/opensearch/data]
  os02:
    <<: *node
    environment:
      <<: *node-env
      node.name: os02
    volumes: [osdata02:/usr/share/opensearch/data]
  os03:
    <<: *node
    environment:
      <<: *node-env
      node.name: os03
    volumes: [osdata03:/usr/share/opensearch/data]
  dashboards:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboards
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION}
    image: local/stack-monitoring-dashboards:${OPENSEARCH_VERSION}
    mem_limit: 1536m
    depends_on:
      os01: {condition: service_healthy}
      os02: {condition: service_healthy}
      os03: {condition: service_healthy}
    ports: ['127.0.0.1:5602:5601']
    environment:
      OPENSEARCH_HOSTS: '["https://os01:9200","https://os02:9200","https://os03:9200"]'
      OPENSEARCH_USERNAME: stack_dashboards
      OPENSEARCH_PASSWORD: ${DASHBOARDS_PASSWORD}
      MONITORING_COLLECTOR_PASSWORD: ${MONITORING_COLLECTOR_PASSWORD}
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - ./docker/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - dashboardsdata:/usr/share/opensearch-dashboards/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:5601/app/login >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 40s

volumes:
  osdata01:
  osdata02:
  osdata03:
  dashboardsdata:
